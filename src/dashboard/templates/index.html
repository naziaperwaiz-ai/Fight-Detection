<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Detection Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }

        .header {
            background: #12121a;
            padding: 16px 24px;
            border-bottom: 1px solid #1e1e2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 1.2rem; color: #fff; letter-spacing: 1px; }
        .header .status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #888; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .container { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 57px); }

        .main { padding: 20px; overflow-y: auto; }
        .sidebar { background: #12121a; border-left: 1px solid #1e1e2e; display: flex; flex-direction: column; }

        /* Cameras */
        .section-title { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .cameras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .camera-card {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 8px;
            overflow: hidden;
        }
        .camera-header {
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e1e2e;
        }
        .camera-name { font-size: 0.85rem; font-weight: 600; }
        .camera-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: #1a2a1a;
            color: #00ff88;
        }
        .camera-badge.alert { background: #2a1a1a; color: #ff4444; }
        .score-bar-wrap { padding: 12px 14px; }
        .score-label { font-size: 0.75rem; color: #888; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .score-bar { height: 6px; background: #1e1e2e; border-radius: 3px; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 3px; transition: width 0.3s, background 0.3s; }
        .camera-actions { padding: 8px 14px; display: flex; gap: 8px; }
        .btn-sm {
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #2a2a3a;
            background: #1a1a2a;
            color: #aaa;
            cursor: pointer;
        }
        .btn-sm:hover { background: #2a2a3a; color: #fff; }
        .btn-sm.danger { border-color: #3a1a1a; color: #ff6666; }
        .btn-sm.danger:hover { background: #3a1a1a; }

        /* Add camera */
        .add-camera-card {
            background: #12121a;
            border: 1px dashed #2a2a3a;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .add-camera-card input, .add-camera-card select {
            background: #0a0a0f;
            border: 1px solid #2a2a3a;
            border-radius: 4px;
            color: #e0e0e0;
            padding: 8px 10px;
            font-size: 0.82rem;
            width: 100%;
        }
        .btn-primary {
            background: #2a4aff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.82rem;
        }
        .btn-primary:hover { background: #3a5aff; }

        /* Event log */
        .event-log { flex: 1; overflow-y: auto; }
        .event-log-header { padding: 14px 16px; border-bottom: 1px solid #1e1e2e; font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .event-item { padding: 12px 16px; border-bottom: 1px solid #1a1a2a; }
        .event-item:hover { background: #1a1a2a; }
        .event-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .event-type { font-size: 0.82rem; font-weight: 600; color: #ff4444; }
        .event-time { font-size: 0.72rem; color: #666; }
        .event-meta { font-size: 0.75rem; color: #888; }
        .event-clip { font-size: 0.72rem; color: #4a8aff; cursor: pointer; margin-top: 4px; text-decoration: underline; }
        .no-events { padding: 24px 16px; font-size: 0.82rem; color: #555; text-align: center; }

        /* Settings */
        .settings-panel { padding: 14px 16px; border-top: 1px solid #1e1e2e; }
        .settings-panel .section-title { margin-bottom: 10px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.8rem; }
        .setting-row input[type=range] { width: 120px; }
        .setting-val { color: #4a8aff; font-size: 0.8rem; width: 36px; text-align: right; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚠ FIGHT DETECTION SYSTEM</h1>
    <div class="status">
        <div class="dot"></div>
        <span id="status-text">System Active</span>
        <span style="margin-left:12px;color:#555" id="last-update"></span>
    </div>
</div>

<div class="container">
    <div class="main">
        <div class="section-title">Live Cameras</div>
        <div class="cameras-grid" id="cameras-grid"></div>

        <div class="section-title" style="margin-top:8px">Add Camera</div>
        <div class="add-camera-card">
            <input id="new-cam-id"     type="text"   placeholder="Camera ID (e.g. CAM-02)">
            <input id="new-cam-room"   type="text"   placeholder="Room Name (e.g. Ward B)">
            <input id="new-cam-source" type="text"   placeholder="Source (0 = webcam, or RTSP URL)">
            <input id="new-cam-thresh" type="number" placeholder="Threshold (0.7)" step="0.05" min="0.5" max="1.0" value="0.7">
            <button class="btn-primary" onclick="addCamera()">+ Add Camera</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="event-log-header">Event Log</div>
        <div class="event-log" id="event-log">
            <div class="no-events">No events yet</div>
        </div>
        <div class="settings-panel">
            <div class="section-title">Global Settings</div>
            <div class="setting-row">
                <span>Confirm Seconds</span>
                <input type="range" min="1" max="10" value="3" oninput="this.nextElementSibling.textContent=this.value+'s'">
                <span class="setting-val">3s</span>
            </div>
            <div class="setting-row">
                <span>Cooldown</span>
                <input type="range" min="30" max="300" value="120" step="10" oninput="this.nextElementSibling.textContent=this.value+'s'">
                <span class="setting-val">120s</span>
            </div>
        </div>
    </div>
</div>

<script>
let cameras = [];
let events  = [];

async function loadCameras() {
    const res = await fetch('/api/cameras');
    cameras   = await res.json();
    renderCameras();
}

async function loadEvents() {
    const res = await fetch('/api/events');
    events    = await res.json();
    renderEvents();
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function renderCameras() {
    const grid = document.getElementById('cameras-grid');
    grid.innerHTML = cameras.map(cam => `
        <div class="camera-card" id="card-${cam.id}">
            <div class="camera-header">
                <span class="camera-name">${cam.id} — ${cam.room}</span>
                <span class="camera-badge" id="badge-${cam.id}">LIVE</span>
            </div>
            <img src="/video_feed/${cam.id}" style="width:100%;display:block;" />
            <div class="score-bar-wrap">
                <div class="score-label">
                    <span>Violence Score</span>
                    <span id="score-${cam.id}">0.00</span>
                </div>
                <div class="score-bar">
                    <div class="score-fill" id="fill-${cam.id}" style="width:0%;background:#00ff88"></div>
                </div>
            </div>
            <div class="camera-actions">
                <button class="btn-sm" onclick="editCamera('${cam.id}')">⚙ Settings</button>
                <button class="btn-sm danger" onclick="deleteCamera('${cam.id}')">✕ Remove</button>
            </div>
        </div>
    `).join('');
}

function renderEvents() {
    const log = document.getElementById('event-log');
    if (events.length === 0) {
        log.innerHTML = '<div class="no-events">No events yet</div>';
        return;
    }
    log.innerHTML = [...events].reverse().map(e => `
        <div class="event-item">
            <div class="event-top">
                <span class="event-type">⚠ ${e.event_type}</span>
                <span class="event-time">${e.timestamp}</span>
            </div>
            <div class="event-meta">${e.camera_id} — ${e.room} — ${(e.confidence*100).toFixed(1)}%</div>
            ${e.clip_path && e.clip_path !== 'Saving...' ?
                `<div class="event-clip" onclick="playClip('${e.clip_path}')">▶ Play Clip</div>` : ''}
        </div>
    `).join('');
}

function updateScore(camId, score) {
    const el   = document.getElementById(`score-${camId}`);
    const fill = document.getElementById(`fill-${camId}`);
    const badge = document.getElementById(`badge-${camId}`);
    if (!el) return;
    el.textContent   = score.toFixed(2);
    fill.style.width = (score * 100) + '%';
    fill.style.background = score >= 0.7 ? '#ff4444' : score >= 0.4 ? '#ffaa00' : '#00ff88';
    badge.textContent  = score >= 0.7 ? 'ALERT' : 'LIVE';
    badge.className    = 'camera-badge' + (score >= 0.7 ? ' alert' : '');
}

async function addCamera() {
    const id     = document.getElementById('new-cam-id').value.trim();
    const room   = document.getElementById('new-cam-room').value.trim();
    const source = document.getElementById('new-cam-source').value.trim();
    const thresh = document.getElementById('new-cam-thresh').value;
    if (!id || !room || !source) { alert('Fill all fields'); return; }
    await fetch('/api/cameras/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id, room, source, threshold: thresh})
    });
    loadCameras();
}

async function deleteCamera(camId) {
    if (!confirm(`Remove ${camId}?`)) return;
    await fetch(`/api/cameras/delete/${camId}`, {method: 'DELETE'});
    loadCameras();
}

function editCamera(camId) {
    const cam    = cameras.find(c => c.id === camId);
    const thresh = prompt(`Threshold for ${camId} (current: ${cam.threshold}):`, cam.threshold);
    if (thresh === null) return;
    fetch(`/api/cameras/update/${camId}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({threshold: parseFloat(thresh)})
    });
}

function playClip(clipPath) {
    const filename = clipPath.split('\\').pop().split('/').pop();
    window.open(`/clips/${filename}`, '_blank');
}

// auto refresh
loadCameras();
loadEvents();
setInterval(loadEvents, 5000);
</script>
</body>
</html>
